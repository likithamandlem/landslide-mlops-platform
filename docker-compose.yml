version: "3.8"

services:
  api:
    build: .
    ports:
      - "8002:8002"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      sh -c "pip install mlflow -q &&
             mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri mlruns"
    restart: unless-stopped